   <!-- JavaScript for the MOBILE NAV MENU -->
    <script>
        const nav  = document.getElementById("myTopnav");
        const icon = document.getElementById("menuIcon");
        const btn  = document.getElementById("menuToggle");

        /* Mobile hamburger */
        function toggleMenu() {
            const isOpen = nav.classList.toggle("responsive");
            icon.textContent = isOpen ? "close" : "menu";
            btn.setAttribute("aria-expanded", isOpen);
            if (!isOpen) closeAllSubmenus();
        }

        /* Dropdown helpers */
        function closeAllSubmenus(except) {
            document.querySelectorAll(".nav-item.open").forEach(item => {
                if (item === except) return;
                item.classList.remove("open");
                item.querySelector(".submenu-toggle").setAttribute("aria-expanded", "false");
            });
        }

        /* Chevron buttons open/close their own submenu */
        document.querySelectorAll(".submenu-toggle").forEach(toggle => {
            toggle.addEventListener("click", () => {
                const item = toggle.closest(".nav-item");
                const isOpen = item.classList.toggle("open");
                toggle.setAttribute("aria-expanded", isOpen);
                closeAllSubmenus(item);          /* one open at a time */
            });
        });

        /* Escape closes submenus and returns focus to the chevron */
        document.addEventListener("keydown", e => {
            if (e.key !== "Escape") return;
            const open = document.querySelector(".nav-item.open");
            if (open) {
                const toggle = open.querySelector(".submenu-toggle");
                closeAllSubmenus();
                toggle.focus();
            }
        });

        /* Clicking elsewhere closes submenus */
        document.addEventListener("click", e => {
            if (!e.target.closest(".nav-item.has-dropdown")) closeAllSubmenus();
        });
    </script>
